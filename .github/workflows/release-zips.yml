name: Release ZIPs

# When a release is published, build one ZIP per skill (plus a plugin
# ZIP) and attach them to the release, so people can download and upload
# skills without using Git or the terminal.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIPs
        run: scripts/build-skill-zips.sh dist
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
      - name: Keep as build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/*.zip
